name: evolve

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Ruff lint
        run: ruff check .
      - name: Run mypy
        run: mypy orchestrator
      - name: Run pytest
        run: pytest -q

  evolution:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        problem: [sample_problem, shortest_path, knapsack]
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Execute orchestrator demo
        env:
          EVOLVE_PROBLEM: ${{ matrix.problem }}
        run: |
          python -m orchestrator.run_loop
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-${{ matrix.problem }}-${{ matrix.run }}
          path: |
            .artifacts
          if-no-files-found: ignore
