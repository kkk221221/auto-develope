[project]
name = "self-evolving-system"
version = "0.1.0"
description = "Reference implementation scaffold for an LLM API-driven self-evolving algorithm system"
authors = [{ name = "AutoGenerated" }]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.3.4",
  "mypy>=1.8",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator"]


[tool.pytest.ini_options]
markers = [
  "integration: marks tests that hit the live LLM API",
]
